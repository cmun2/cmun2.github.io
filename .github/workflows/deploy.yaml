name: Deploy to GitHub Pages

# Nothing here runs until the remote repo exists. See README → "Getting it live".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes a waiting one but never
# cancels a deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Quartz reads git history to date pages that have no frontmatter
          # date. Without full history every page looks like it was written
          # the day CI first ran.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.5.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The vault is not on the runner, so the sync cannot and must not run
      # here. CI builds the content/ tree exactly as committed. The two checks
      # that do not need the vault still run — they are the last line of
      # defence before something becomes public.
      - name: Check for smuggled or broken content
        run: |
          pnpm blog:links

      - name: Build
        run: pnpm blog:build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
