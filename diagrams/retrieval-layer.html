<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The retrieval layer, end to end on one machine</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* SIGNAL / SYSTEM tokens — the same palette the blog and the portfolio use.
     Dark is the portfolio's own graphite ground; light is derived from it,
     keeping the ink / rule / accent relationships rather than inverting.
     On the blog these same --dg-* names are remapped onto the site's theme
     variables in quartz/styles/custom.scss, so the diagram follows the
     theme toggle instead of only the OS preference. */
  :root {
    color-scheme: dark light;
    --dg-paper:        #1d1a17;
    --dg-ink:          #f2ede5;
    --dg-muted:        #a89f93;
    --dg-rule:         #332e28;
    --dg-rule-strong:  #4a443c;
    --dg-accent:       #79c979;
    --dg-accent-tint:  rgba(121, 201, 121, 0.06);
    --dg-accent-rule:  rgba(121, 201, 121, 0.50);
    --dg-accent-wash:  rgba(121, 201, 121, 0.04);
    --dg-node:         rgba(242, 237, 229, 0.04);
    --dg-zone:         rgba(242, 237, 229, 0.03);
    --dg-zone-rule:    rgba(242, 237, 229, 0.12);
    --dg-sans: 'Space Grotesk', 'Apple SD Gothic Neo', system-ui, sans-serif;
    --dg-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --dg-paper:       #fbf8f2;
      --dg-ink:         #14110d;
      --dg-muted:       #554e42;
      --dg-rule:        #e2dbcd;
      --dg-rule-strong: #cfc5b2;
      --dg-accent:      #2c6f30;
      --dg-accent-tint: rgba(44, 111, 48, 0.08);
      --dg-accent-rule: rgba(44, 111, 48, 0.50);
      --dg-accent-wash: rgba(44, 111, 48, 0.04);
      --dg-node:        rgba(20, 17, 13, 0.04);
      --dg-zone:        rgba(20, 17, 13, 0.03);
      --dg-zone-rule:   rgba(20, 17, 13, 0.12);
    }
  }

  body {
    font-family: var(--dg-sans);
    background: var(--dg-paper);
    color: var(--dg-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow {
    font-family: var(--dg-mono);
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dg-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-size: clamp(1.4rem, 2.2vw + 0.7rem, 1.9rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin-bottom: 1.5rem;
  }
  svg { width: 100%; min-width: 900px; display: block; }
  figcaption {
    font-size: 0.85rem;
    line-height: 1.6;
    max-width: 62ch;
    color: var(--dg-muted);
    margin-top: 1.25rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--dg-rule);
  }
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Architecture · local retrieval</p>
<h1>The retrieval layer, end to end on one machine</h1>
<figure style="overflow-x:auto">

<title id="retrieval-layer-title">The retrieval layer, end to end on one machine</title>
<desc id="retrieval-layer-desc">Architecture diagram of a local semantic index. Vault notes and AI session transcripts are chunked, embedded by a model running on the laptop's CPU, and written to a single Milvus Lite file, which a command-line search and an MCP server read. A dashed path leaving the embedding step for a hosted API stops at the machine boundary; the only sockets opened are loopback.</desc>

<figcaption>10,659 chunks over 226 documents. The only sockets the process opens are the loopback pair between the client and the in-process engine, checked three ways: an in-process socket trap during a real index and query, lsof during a live search, and the whole run with the Wi-Fi switched off.</figcaption>
